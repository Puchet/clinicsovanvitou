<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>BA Hospital Management System</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Khmer:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="lg" hidden>
        <div class="lb">
            <div class="ll">
                <div class="brand-mark" aria-label="BA Hospital Management System">
                    <img src="ba-logo.png" alt="BA Hospital Management System logo">
                </div>
                <div class="brand-name">
                    <span>BA HOSPITAL MANAGEMENT</span>
                    <span>SYSTEM</span>
                </div>
                <div class="brand-icons" aria-label="Healthcare icons">
                    <span class="brand-icon blue">🏥</span>
                    <span class="brand-icon purple">🩺</span>
                    <span class="brand-icon red">💊</span>
                    <span class="brand-icon green">🧪</span>
                </div>
            </div>
            <div class="lr">
                <h2>Sign in</h2>
                <p class="mu">Please sign in to your account.</p>
                <label>Email</label>
                <input id="em" class="in" placeholder="umvankathong@gmail.com">
                <label>Password</label>
                <input id="pw" type="password" class="in" placeholder="••••••••">
                <label class="remember"><input type="checkbox"> Remember me</label>
                <button id="login-submit" data-a="login">Sign in</button>
                <p class="mu alt-text"><span id="ln">Sign in with your clinic account.</span></p>
            </div>
        </div>
        <div id="login-loading" class="login-loading" role="status" aria-live="polite" hidden>
            <div class="login-loading-card">
                <div class="login-loading-logo" aria-hidden="true">
                    <svg viewBox="0 0 48 48"><path d="M24 5 40 11v12c0 10-6.8 16.8-16 20C14.8 39.8 8 33 8 23V11l16-6Z" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M12 24h8l4-8 5 16 4-8h4" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </div>
                <strong>BA HOSPITAL MANAGEMENT SYSTEM</strong>
                <span>Signing in…</span>
            </div>
        </div>
    </div>
    <div id="startup-loading" class="login-loading" role="status" aria-live="polite">
        <div class="login-loading-card">
            <div class="login-loading-logo" aria-hidden="true">
                <svg viewBox="0 0 48 48"><path d="M24 5 40 11v12c0 10-6.8 16.8-16 20C14.8 39.8 8 33 8 23V11l16-6Z" fill="none" stroke="currentColor" stroke-width="2.5"/><path d="M12 24h8l4-8 5 16 4-8h4" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <strong>BA HOSPITAL MANAGEMENT SYSTEM</strong>
            <span>Loading…</span>
        </div>
    </div>
    <div id="app">
        <aside id="sd">
            <div class="logo" id="lgo"><img src="ba-logo.png" alt="BA logo"></div>
            <div class="nav" id="nv"></div>
            <div class="ft">
                <div class="it" data-a="settings"><i>⚙</i>Settings</div>
                <div class="it out" data-a="logout"><i>⎋</i>Logout</div>
            </div>
        </aside>
        <main>
            <div class="top"><button class="bg" data-a="menu">☰</button><span id="tt"></span><div class="language-picker"
                    translate="no"><button type="button" class="language-picker-trigger" data-a="langmenu"
                        aria-label="Select language" title="Select language" aria-haspopup="true"
                        aria-expanded="false">🌐</button><div class="language-picker-menu" role="group"
                        aria-label="Select language" hidden><button type="button" data-a="lang:en"
                            aria-pressed="false">English</button><button type="button" data-a="lang:km"
                            aria-pressed="false">ខ្មែរ</button><button type="button" data-a="lang:both"
                            aria-pressed="false">ខ្មែរ + English</button></div></div><button data-a="theme"
                    title="Theme">◐</button></div>
            <div id="v"></div>
        </main>
    </div>
    <div id="md">
        <form id="mf"></form>
    </div>
    <div id="ts"></div>
    <div id="capture-protection-curtain" role="status" aria-live="polite" hidden>
        <strong>Content hidden</strong>
        <span>Return to this window to continue.</span>
    </div>
    <script>
        const privateIPv4 = /^(?:10(?:\.\d{1,3}){3}|192\.168(?:\.\d{1,3}){2}|172\.(?:1[6-9]|2\d|3[01])(?:\.\d{1,3}){2})$/.test(location.hostname);
        const localHost = location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.hostname.endsWith('.local') || privateIPv4;
        const sameOriginApi = localHost || location.hostname.endsWith('.synology.me');
        window.API_BASE = sameOriginApi ? '' : 'https://clinicsovanvitou-backend-67e0.onrender.com';
    </script>
    <script src="app.js"></script>
    <script src="patient.js"></script>
</body>

</html>
